[tool.poetry]
name = "sinch-getting-started-send-handle-incoming-sms"
version = "0.1.0"
description = "Getting Started: send and handle incoming SMS with Conversation API (DISPATCH, channel identity)"
readme = "README.md"
package-mode = false

# Dependency versions below were generated/resolved using Python 3.14.5
[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "1.2.2"
flask = "3.1.3"
sinch = "^2.0.0"

# Transitive dependencies (pulled in by flask and sinch above)
annotated-types = "0.7.0"
blinker = "1.9.0"
certifi = "2026.7.22"
charset-normalizer = "3.4.9"
click = "8.4.2"
idna = "3.18"
itsdangerous = "2.2.0"
jinja2 = "3.1.6"
markupsafe = "3.0.3"
pydantic = "2.13.4"
pydantic-core = "2.46.4"
requests = "2.34.2"
typing-inspection = "0.4.2"
typing-extensions = "4.16.0"
urllib3 = "2.7.0"
werkzeug = "3.1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
