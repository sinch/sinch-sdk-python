[tool.poetry]
name = "sinch-getting-started-conversation-send-text-message"
version = "0.1.0"
description = "Getting Started: send a text message with Conversation API"
readme = "README.md"
package-mode = false

# Dependency versions below were generated/resolved using Python 3.14.5
[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "1.2.2"
sinch = "^2.0.0"

# Transitive dependencies (pulled in by sinch above)
annotated-types = "0.7.0"
certifi = "2026.7.22"
charset-normalizer = "3.4.9"
idna = "3.18"
pydantic = "2.13.4"
pydantic-core = "2.46.4"
requests = "2.34.2"
typing-inspection = "0.4.2"
typing-extensions = "4.16.0"
urllib3 = "2.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
